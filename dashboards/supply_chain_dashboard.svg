<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Supply Chain Analytics Dashboard</title>
  <desc id="desc">Dashboard summarizing 10,324 SCMS shipment records, shipment mode mix, delivery timing, data completeness, and extreme delivery differences.</desc>
  <rect width="1200" height="760" fill="#f7f8fa"/>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#14213d}.sub{font:400 14px Arial,sans-serif;fill:#667085}.cardTitle{font:600 13px Arial,sans-serif;fill:#667085}.cardValue{font:700 30px Arial,sans-serif;fill:#14213d}.h2{font:700 18px Arial,sans-serif;fill:#14213d}.label{font:500 13px Arial,sans-serif;fill:#344054}.small{font:400 12px Arial,sans-serif;fill:#667085}.value{font:700 13px Arial,sans-serif;fill:#14213d}.callout{font:600 14px Arial,sans-serif;fill:#14213d}
  </style>

  <text x="60" y="55" class="title">Supply Chain Analytics — SCMS Delivery History</text>
  <text x="60" y="80" class="sub">USAID / PEPFAR shipment data • verified core metrics • portfolio case study</text>

  <g transform="translate(60,110)">
    <rect width="245" height="105" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="22" y="32" class="cardTitle">SHIPMENT RECORDS</text><text x="22" y="72" class="cardValue">10,324</text>
  </g>
  <g transform="translate(325,110)">
    <rect width="245" height="105" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="22" y="32" class="cardTitle">MEDIAN DELIVERY DIFFERENCE</text><text x="22" y="72" class="cardValue">0 days</text>
  </g>
  <g transform="translate(590,110)">
    <rect width="245" height="105" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="22" y="32" class="cardTitle">MEAN DELIVERY DIFFERENCE</text><text x="22" y="72" class="cardValue">−6.02 days</text>
  </g>
  <g transform="translate(855,110)">
    <rect width="285" height="105" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="22" y="32" class="cardTitle">EXTREME DELIVERY DIFFERENCES</text><text x="22" y="72" class="cardValue">216 <tspan class="small">(2.09%)</tspan></text>
  </g>

  <g transform="translate(60,245)">
    <rect width="650" height="310" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="25" y="36" class="h2">Shipment mode mix</text>
    <text x="25" y="58" class="small">Air dominates the observed shipment records.</text>

    <text x="25" y="100" class="label">Air</text><rect x="135" y="84" width="455" height="22" rx="6" fill="#3157d5"/><text x="600" y="100" class="value">6,113 • 59.21%</text>
    <text x="25" y="145" class="label">Truck</text><rect x="135" y="129" width="211" height="22" rx="6" fill="#5b7ae5"/><text x="600" y="145" class="value">2,830 • 27.41%</text>
    <text x="25" y="190" class="label">Air Charter</text><rect x="135" y="174" width="48" height="22" rx="6" fill="#8fa6ef"/><text x="600" y="190" class="value">650 • 6.30%</text>
    <text x="25" y="235" class="label">Ocean</text><rect x="135" y="219" width="28" height="22" rx="6" fill="#b6c4f5"/><text x="600" y="235" class="value">371 • 3.59%</text>
    <text x="25" y="280" class="label">Missing</text><rect x="135" y="264" width="27" height="22" rx="6" fill="#d0d5dd"/><text x="600" y="280" class="value">360 • 3.49%</text>
  </g>

  <g transform="translate(735,245)">
    <rect width="405" height="310" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="25" y="36" class="h2">Delivery timing profile</text>
    <text x="25" y="72" class="label">25th percentile</text><text x="355" y="72" text-anchor="end" class="value">−3 days</text>
    <line x1="25" y1="87" x2="380" y2="87" stroke="#eaecf0"/>
    <text x="25" y="118" class="label">Median</text><text x="355" y="118" text-anchor="end" class="value">0 days</text>
    <line x1="25" y1="133" x2="380" y2="133" stroke="#eaecf0"/>
    <text x="25" y="164" class="label">75th percentile</text><text x="355" y="164" text-anchor="end" class="value">0 days</text>
    <line x1="25" y1="179" x2="380" y2="179" stroke="#eaecf0"/>
    <text x="25" y="210" class="label">Observed minimum</text><text x="355" y="210" text-anchor="end" class="value">−372 days</text>
    <line x1="25" y1="225" x2="380" y2="225" stroke="#eaecf0"/>
    <text x="25" y="256" class="label">Observed maximum</text><text x="355" y="256" text-anchor="end" class="value">192 days</text>
    <text x="25" y="292" class="small">Extreme values are flagged for review, not silently deleted.</text>
  </g>

  <g transform="translate(60,580)">
    <rect width="650" height="135" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="25" y="34" class="h2">Numeric data completeness</text>
    <text x="25" y="72" class="label">Weight</text><rect x="115" y="58" width="400" height="16" rx="5" fill="#edf0f8"/><rect x="115" y="58" width="247" height="16" rx="5" fill="#3157d5"/><text x="535" y="72" class="value">61.72%</text>
    <text x="25" y="108" class="label">Freight cost</text><rect x="115" y="94" width="400" height="16" rx="5" fill="#edf0f8"/><rect x="115" y="94" width="240" height="16" rx="5" fill="#5b7ae5"/><text x="535" y="108" class="value">60.03%</text>
    <text x="25" y="128" class="small">Text entries such as “captured separately” remain meaningful source information.</text>
  </g>

  <g transform="translate(735,580)">
    <rect width="405" height="135" rx="16" fill="#eaf0ff" stroke="#c7d7fe"/>
    <text x="25" y="34" class="h2">Analytical takeaway</text>
    <text x="25" y="66" class="callout">Use medians and segmented analysis.</text>
    <text x="25" y="89" class="small">The mean delivery difference is pulled by large</text>
    <text x="25" y="107" class="small">early/late observations, while the median is 0.</text>
    <text x="25" y="125" class="small">Missing freight/weight values should not be replaced with zero.</text>
  </g>

  <text x="60" y="744" class="small">Dashboard metrics are derived from the 10,324-row SCMS Delivery History dataset used in this repository.</text>
</svg>
